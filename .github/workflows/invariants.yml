# Invariants — exécutés à chaque poussée.
#
# Un invariant jamais lancé ne protège de rien. Ceux de rendu ne peuvent pas
# tourner à la main de façon fiable : ils exigent un serveur démarré, et c'est
# précisément la friction qui les aurait rendus morts en deux semaines — comme
# la migration qu'ils étaient censés attraper.
name: Invariants

on:
  push:
  pull_request:
  # Les invariants de rendu se lancent à la demande, depuis l'onglet Actions.
  workflow_dispatch:
    inputs:
      url_test:
        description: "URL à tester (laisser vide pour ignorer le rendu)"
        required: false
        type: string
      ingerer:
        description: "Envoyer le catalogue en base, même sans changement de données"
        required: false
        default: false
        type: boolean

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Invariants du catalogue
        run: bun run invariants
      - name: Invariants du design system
        run: bun run invariants:design

  # Ingestion automatique du catalogue.
  #
  # Elle ne part que si les données ont changé — inutile de réécrire la base
  # pour un ajustement d'interface — et seulement après les invariants : envoyer
  # en base un catalogue qui viole un invariant y installerait le défaut.
  #
  # L'écriture exige la clé service_role, non récupérable : elle vit dans
  # l'environnement serveur de Lovable. Le déclenchement passe donc par
  # l'application déployée, jamais par un script.
  ingestion:
    needs: regles
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Le catalogue a-t-il changé ?
        id: donnees
        env:
          FORCE: ${{ inputs.ingerer }}
        run: |
          # Le déclenchement manuel court-circuite la détection : il sert à
          # rattraper un retard, quand justement rien n'a changé au dernier commit.
          if [ "$FORCE" = "true" ]; then
            echo "change=oui" >> "$GITHUB_OUTPUT"
            echo "Ingestion forcée."
          elif git diff --name-only HEAD~1 HEAD | grep -qE '^src/donnees/(offres-sources|journal-arbitrages)\.json$'; then
            echo "change=oui" >> "$GITHUB_OUTPUT"
          else
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Catalogue inchangé — ingestion ignorée."
          fi
      - name: Envoi en base
        if: steps.donnees.outputs.change == 'oui' && vars.URL_PROD != ''
        env:
          JETON: ${{ secrets.SEED_TOKEN }}
          URL: ${{ vars.URL_PROD }}
        run: |
          if [ -z "$JETON" ]; then
            echo "::warning::SEED_TOKEN absent — ingestion ignorée."
            exit 0
          fi
          # `--location` : le domaine avec www redirige vers l'apex, et un 307
          # non suivi était compté comme un échec. Un 307 préserve la méthode et
          # le corps, donc le POST reste un POST.
          reponse=$(curl -sS --location -w '\n%{http_code}' -X POST "$URL/api/ingestion" \
            -H "x-seed-token: $JETON" \
            -H "content-type: application/json" \
            -d '{"ecraser":true}')
          corps=$(echo "$reponse" | sed '$d')
          code=$(echo "$reponse" | tail -n1)
          echo "$corps"
          # Un code non 2xx doit faire échouer : une ingestion silencieusement
          # refusée laisserait la base diverger du dépôt sans que personne le voie.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

  # Les tests de rendu exigent une application qui démarre, donc une base. La CI
  # n'a pas les identifiants Lovable Cloud : le serveur n'y démarre jamais.
  #
  # Ils ne tournent PAS sur la production. Ils existent pour attraper une
  # régression avant déploiement, pas pour constater qu'elle est en ligne — et
  # la production étant en retard sur la branche poussée, ils produiraient des
  # échecs sans rapport avec le dernier commit. Exactement le signal qu'on cesse
  # de lire.
  #
  # En sommeil, donc, et lançables à la demande sur une URL choisie. Le jour où
  # une prévisualisation par branche existera, ils reprendront leur vraie place.
  rendu:
    runs-on: ubuntu-latest
    if: inputs.url_test != ''
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Invariants de rendu
        env:
          URL_TEST: ${{ inputs.url_test }}
        run: bun run invariants:rendu
